<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Fondo ultra minimalista (Casi negro puro) -->
  <rect width="120" height="120" rx="28" fill="#111111" />

  <!-- 
    Monograma EP
    Trazo limpio, más delgado (elegante), blanco puro, sin brillos ni gradientes.
  -->
  <path d="M 85 90 
           L 35 90 
           L 35 30 
           L 65 30 
           A 20 20 0 0 1 65 70 
           L 35 70" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
